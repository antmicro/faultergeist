name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  BUILD_PACKAGES: >-
    build-essential bison ccache clang cmake help2man gawk libffi-dev libfl-dev libreadline-dev tcl-dev zlib1g-dev 7zip graphviz xdot

jobs:
  prepare-verilator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -yq update >/dev/null
          sudo apt-get -yq install $BUILD_PACKAGES
      - uses: actions/checkout@v4.2.2
      - uses: actions/cache@v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - name: Build Verilator
        run: |
          git clone https://github.com/verilator/verilator.git verilator -b master
          cd verilator
          git show -s
          autoconf
          ./configure --prefix="$PWD"
          make -j "$(nproc)" CC="ccache gcc" CXX="ccache g++"
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
      - name: Package Verilator
        run: tar -cf verilator.tar verilator
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: verilator
          path: verilator.tar
          retention-days: 1

  prepare-yosys:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -yq update >/dev/null
          sudo apt-get -yq install $BUILD_PACKAGES
      - uses: actions/checkout@v4.2.2
      - uses: actions/cache@v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - name: Build Yosys and slang plugin
        run: |
          git submodule update --init --recursive third_party/yosys third_party/yosys-slang
          cd third_party/yosys
          cmake -B build . -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel "$(nproc)"
          cd ../yosys-slang
          make -j "$(nproc)" CXX="ccache g++" YOSYS_PREFIX="$GITHUB_WORKSPACE/third_party/yosys/build/"
          mkdir -p ../yosys/build/share/plugins
          cp build/slang.so ../yosys/build/share/plugins
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
      - name: Package Yosys
        run: tar -cf yosys.tar third_party/yosys
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: yosys
          path: yosys.tar
          retention-days: 1

  check-formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -yq update >/dev/null
          sudo apt-get -yq install $BUILD_PACKAGES clang-format clang-tidy libc++-dev libc++abi-dev
      - uses: actions/checkout@v4.2.2
      - uses: actions/cache@v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - name: Configure lint build
        run: >-
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_FLAGS=-stdlib=libc++
      - run: cmake --build build --target slang_slang -j "$(nproc)"
      - name: Check formatting
        run: find ./src -regextype posix-egrep -regex '.*(\.cpp|\.h)' -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Check linting
        run: run-clang-tidy -p build "^$GITHUB_WORKSPACE/src/.*(\.cpp|\.h)$" -header-filter="^$GITHUB_WORKSPACE/src/.*" -warnings-as-errors='*'
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

  run-example:
    needs: [prepare-verilator, prepare-yosys]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -yq update >/dev/null
          sudo apt-get -yq install $BUILD_PACKAGES
      - uses: actions/checkout@v4.2.2
      - uses: actions/cache@v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - uses: actions/download-artifact@v4.3.0
        with: {name: verilator}
      - uses: actions/download-artifact@v4.3.0
        with: {name: yosys}
      - run: tar -xf verilator.tar && tar -xf yosys.tar
      - name: Use prepared Yosys
        run: |
          yosys_dir="$GITHUB_WORKSPACE/third_party/yosys/build"
          echo "$yosys_dir" >> "$GITHUB_PATH"
          "$yosys_dir/yosys" -V
          "$yosys_dir/yosys" -m slang -p 'help read_slang'
      - name: Run example
        env:
          VERILATOR_ROOT: ${{ github.workspace }}/verilator
        run: |
          cd example
          bash run.sh
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: example-output
          path: example/obj_dir
          retention-days: 1

  run-self-tests:
    needs: [prepare-verilator, prepare-yosys]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -yq update >/dev/null
          sudo apt-get -yq install $BUILD_PACKAGES
      - uses: actions/checkout@v4.2.2
      - uses: actions/cache@v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - uses: actions/download-artifact@v4.3.0
        with: {name: verilator}
      - uses: actions/download-artifact@v4.3.0
        with: {name: yosys}
      - run: git submodule update --init --recursive third_party/asap7
      - run: tar -xf verilator.tar && tar -xf yosys.tar
      - name: Use prepared Yosys
        run: |
          yosys_dir="$GITHUB_WORKSPACE/third_party/yosys/build"
          echo "$yosys_dir" >> "$GITHUB_PATH"
          "$yosys_dir/yosys" -V
          "$yosys_dir/yosys" -m slang -p 'help read_slang'
      - name: Build and run unit and integration tests
        env:
          VERILATOR_ROOT: ${{ github.workspace }}/verilator
        run: |
          set -o pipefail
          cmake -B build -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j "$(nproc)" 2>&1 | tee build/cmake-build.log
          ctest --test-dir build --output-on-failure --no-tests=error --tests-regex 'unit|integration' --parallel "$(nproc)"
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: self-test-build
          path: build/
          if-no-files-found: ignore
          retention-days: 1

  run-worker-end-to-end-tests:
    needs: [prepare-verilator, prepare-yosys]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -yq update >/dev/null
          sudo apt-get -yq install $BUILD_PACKAGES
      - uses: actions/checkout@v4.2.2
      - uses: actions/cache@v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - uses: actions/download-artifact@v4.3.0
        with: {name: verilator}
      - uses: actions/download-artifact@v4.3.0
        with: {name: yosys}
      - run: git submodule update --init --recursive third_party/asap7
      - run: tar -xf verilator.tar && tar -xf yosys.tar
      - name: Use prepared Yosys
        run: |
          yosys_dir="$GITHUB_WORKSPACE/third_party/yosys/build"
          echo "$yosys_dir" >> "$GITHUB_PATH"
          "$yosys_dir/yosys" -V
          "$yosys_dir/yosys" -m slang -p 'help read_slang'
      - name: Build and run worker end-to-end tests
        env:
          VERILATOR_ROOT: ${{ github.workspace }}/verilator
        run: |
          set -o pipefail
          cmake -B build -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Debug -DFI_E2E_FORCE_SETUP_VEER=OFF
          cmake --build build -j "$(nproc)" 2>&1 | tee build/cmake-build.log
          ctest --test-dir build --output-on-failure --no-tests=error --tests-regex 'e2e.worker'
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: worker-end-to-end-build
          path: build/
          if-no-files-found: ignore
          retention-days: 1

  run-parser-tests:
    needs: [prepare-verilator]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -yq update >/dev/null
          sudo apt-get -yq install $BUILD_PACKAGES &> /dev/null
      - uses: actions/checkout@v4.2.2
      - uses: actions/cache@v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - uses: actions/download-artifact@v4.3.0
        with: {name: verilator}
      - run: git submodule update --init --recursive third_party/asap7
      - run: tar -xf verilator.tar
      - name: Fetch OpenROAD parser corpus
        run: git clone --depth 1 https://github.com/The-OpenROAD-Project/OpenROAD.git "$RUNNER_TEMP/OpenROAD"
      - name: Build and run parser tests
        env:
          VERILATOR_ROOT: ${{ github.workspace }}/verilator
        run: |
          ./build.sh
          src/FaultGenerator/test/testParser.sh "$RUNNER_TEMP/OpenROAD/test" build/src/FaultGenerator/test/LibertyParserBin
          src/FaultGenerator/test/testParser.sh "$GITHUB_WORKSPACE/third_party/asap7" build/src/FaultGenerator/test/LibertyParserBin
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
