name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  BUILD_PACKAGES: >-
    python3 nodejs make build-essential autoconf flex bison git ccache help2man curl
    cmake gzip file grep gawk lld clang libffi-dev libfl-dev libreadline-dev
    pkg-config tcl-dev zlib1g-dev graphviz xdot 7zip

jobs:
  prepare-verilator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: debian:forky
    env:
      VERILATOR_URL: ${{ vars.VERILATOR_URL }}
    steps:
      - name: Install dependencies
        run: |
          apt-get -yq update >/dev/null
          apt-get -yq install $BUILD_PACKAGES
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - name: Build Verilator
        run: |
          git clone https://github.com/verilator/verilator.git verilator -b master
          cd verilator
          git show -s
          autoconf
          ./configure --prefix="$PWD"
          make -j "$(nproc)" CC="ccache gcc" CXX="ccache g++"
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
      - name: Package Verilator
        if: always()
        run: tar -cf verilator.tar verilator
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verilator
          path: verilator.tar
          if-no-files-found: ignore
          retention-days: 1

  prepare-yosys:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: debian:forky
    steps:
      - name: Install dependencies
        run: |
          apt-get -yq update >/dev/null
          apt-get -yq install $BUILD_PACKAGES
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - name: Build Yosys and slang plugin
        run: |
          git submodule update --init --recursive third_party/yosys third_party/yosys-slang
          cd third_party/yosys
          cmake -B build . -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --config Release --parallel "$(nproc)"
          cmake --install build --strip
          cd ../yosys-slang
          make -j "$(nproc)" CXX="ccache g++" install
          mkdir -p ../yosys/build/share/plugins
          cp build/slang.so ../yosys/build/share/plugins
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
      - name: Package Yosys
        if: always()
        run: tar -cf yosys.tar third_party/yosys
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: yosys
          path: yosys.tar
          if-no-files-found: ignore
          retention-days: 1

  prepare-liberty:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: debian:forky
    steps:
      - name: Install dependencies
        run: |
          apt-get -yq update >/dev/null
          apt-get -yq install $BUILD_PACKAGES
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: git submodule update --init --recursive third_party/asap7
      - name: Package Liberty files
        if: always()
        run: tar -cf liberty.tar third_party/asap7/LIB/NLDM/asap7sc7p5t_*_RVT_TT_nldm_*.lib.7z
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: liberty
          path: liberty.tar
          if-no-files-found: ignore
          retention-days: 1

  check-formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: debian:forky
    steps:
      - name: Install dependencies
        run: |
          apt-get -yq update >/dev/null
          apt-get -yq install $BUILD_PACKAGES clang-format clang-tidy libc++-dev libc++abi-dev
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - name: Configure lint build
        run: >-
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_FLAGS=-stdlib=libc++
      - run: cmake --build build --target slang_slang -j "$(nproc)"
      - name: Check formatting
        run: find ./src -regextype posix-egrep -regex '.*(\.cpp|\.h)' -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Check linting
        run: run-clang-tidy -p build "^$GITHUB_WORKSPACE/src/.*(\.cpp|\.h)$" -header-filter="^$GITHUB_WORKSPACE/src/.*" -warnings-as-errors='*'
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

  run-example:
    needs: [prepare-verilator, prepare-yosys]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: debian:forky
    steps:
      - name: Install dependencies
        run: |
          apt-get -yq update >/dev/null
          apt-get -yq install $BUILD_PACKAGES
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: verilator}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: yosys}
      - run: tar -xf verilator.tar && tar -xf yosys.tar
      - name: Run example
        env:
          VERILATOR_ROOT: ${{ github.workspace }}/verilator
        run: |
          export PATH="$GITHUB_WORKSPACE/third_party/yosys/build:$PATH"
          cd example
          bash run.sh
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: example-output
          path: example/obj_dir
          retention-days: 1

  run-self-tests:
    needs: [prepare-verilator, prepare-yosys, prepare-liberty]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: debian:forky
    steps:
      - name: Install dependencies
        run: |
          apt-get -yq update >/dev/null
          apt-get -yq install $BUILD_PACKAGES
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: verilator}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: yosys}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: liberty}
      - run: tar -xf verilator.tar && tar -xf yosys.tar && tar -xf liberty.tar
      - name: Build and run unit and integration tests
        env:
          VERILATOR_ROOT: ${{ github.workspace }}/verilator
        run: |
          set -o pipefail
          export PATH="$GITHUB_WORKSPACE/third_party/yosys/build:$PATH"
          cmake -B build -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j "$(nproc)" 2>&1 | tee build/Testing/Temporary/cmake-build.log
          ctest --test-dir build --output-on-failure --no-tests=error --tests-regex 'unit|integration' --parallel "$(nproc)"
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: self-test-build
          path: build/
          if-no-files-found: ignore
          retention-days: 1

  run-worker-end-to-end-tests:
    needs: [prepare-verilator, prepare-yosys, prepare-liberty]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container: debian:forky
    steps:
      - name: Install dependencies
        run: |
          apt-get -yq update >/dev/null
          apt-get -yq install $BUILD_PACKAGES
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: verilator}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: yosys}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: liberty}
      - run: tar -xf verilator.tar && tar -xf yosys.tar && tar -xf liberty.tar
      - name: Build and run worker end-to-end tests
        env:
          VERILATOR_ROOT: ${{ github.workspace }}/verilator
        run: |
          set -o pipefail
          export PATH="$GITHUB_WORKSPACE/third_party/yosys/build:$PATH"
          cmake -B build -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug -DFI_E2E_FORCE_SETUP_VEER=OFF
          cmake --build build -j "$(nproc)" 2>&1 | tee build/cmake-build.log
          ctest --test-dir build --output-on-failure --no-tests=error --tests-regex 'e2e.worker'
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: worker-end-to-end-build
          path: build/
          if-no-files-found: ignore
          retention-days: 1

  run-parser-tests:
    needs: [prepare-verilator, prepare-liberty]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: debian:forky
    steps:
      - name: Install dependencies
        run: |
          apt-get -yq update >/dev/null
          apt-get -yq install $BUILD_PACKAGES
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: verilator}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: liberty}
      - run: tar -xf verilator.tar && tar -xf liberty.tar
      - name: Fetch OpenROAD parser corpus
        run: git clone --depth 1 https://github.com/The-OpenROAD-Project/OpenROAD.git "$RUNNER_TEMP/OpenROAD"
      - name: Build and run parser tests
        env:
          VERILATOR_ROOT: ${{ github.workspace }}/verilator
        run: |
          ./build.sh
          src/FaultGenerator/test/testParser.sh "$RUNNER_TEMP/OpenROAD/test" build/src/FaultGenerator/test/LibertyParserBin
          src/FaultGenerator/test/testParser.sh "$GITHUB_WORKSPACE/third_party/asap7" build/src/FaultGenerator/test/LibertyParserBin
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
