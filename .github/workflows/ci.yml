name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CXX: 'g++-14'
  CC: 'gcc-14'

jobs:
  prepare-verilator:
    runs-on: ubuntu-26.04
    container: debian:trixie
    timeout-minutes: 120
    steps:
      - name: Install git
        run: apt-get -yq update > /dev/null && apt-get -yq install git
      - uses: actions/checkout@v4.2.2
      - name: Install dependencies
        run: ci/install-packages.sh
      - uses: actions/cache@v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - name: Build Verilator
        run: ci/build-verilator.sh
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
      - name: Package Verilator
        run: tar -cf verilator.tar verilator
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: verilator
          path: verilator.tar
          retention-days: 1

  prepare-yosys:
    runs-on: ubuntu-26.04
    container: debian:trixie
    timeout-minutes: 120
    steps:
      - name: Install git
        run: apt-get -yq update > /dev/null && apt-get -yq install git
      - uses: actions/checkout@v4.2.2
      - name: Install dependencies
        run: ci/install-packages.sh
      - uses: actions/cache@v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - run: git config --global --add safe.directory '*'
      - name: Build Yosys
        run: ci/build-yosys.sh
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
      - name: Package Yosys
        run: tar -cf yosys.tar third_party/yosys
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: yosys
          path: yosys.tar
          retention-days: 1

  check-formatting:
    runs-on: ubuntu-26.04
    container: debian:trixie
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install dependencies
        run: ci/install-packages.sh
      - name: Check formatting
        run: ci/check-formatting.sh

  run-example:
    needs: [prepare-verilator, prepare-yosys]
    runs-on: ubuntu-26.04
    container: debian:trixie
    timeout-minutes: 120
    steps:
      - name: Install git
        run: apt-get -yq update > /dev/null && apt-get -yq install git
      - uses: actions/checkout@v4.2.2
      - name: Install dependencies
        run: ci/install-packages.sh
      - uses: actions/cache@v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - uses: actions/download-artifact@v4.3.0
        with: {name: verilator}
      - uses: actions/download-artifact@v4.3.0
        with: {name: yosys}
      - run: tar -xf verilator.tar && tar -xf yosys.tar
      - name: Run example
        env:
          VERILATOR_ROOT: ${{ github.workspace }}/verilator
        run: ci/run-example.sh
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: example-output
          path: example/obj_dir
          retention-days: 1

  run-self-tests:
    needs: [prepare-verilator, prepare-yosys]
    runs-on: ubuntu-26.04
    container: debian:trixie
    timeout-minutes: 120
    steps:
      - name: Install git
        run: apt-get -yq update > /dev/null && apt-get -yq install git
      - uses: actions/checkout@v4.2.2
      - name: Install dependencies
        run: ci/install-packages.sh
      - uses: actions/cache@v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - uses: actions/download-artifact@v4.3.0
        with: {name: verilator}
      - uses: actions/download-artifact@v4.3.0
        with: {name: yosys}
      - run: git config --global --add safe.directory '*'
      - run: git submodule update --init --recursive third_party/asap7
      - run: tar -xf verilator.tar && tar -xf yosys.tar
      - name: Build and run unit and integration tests
        env:
          VERILATOR_ROOT: ${{ github.workspace }}/verilator
        run: ci/run-self-tests.sh
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: self-test-build
          path: build/
          if-no-files-found: ignore
          retention-days: 1

  run-worker-end-to-end-tests:
    needs: [prepare-verilator, prepare-yosys]
    runs-on: ubuntu-26.04
    container: debian:trixie
    timeout-minutes: 180
    steps:
      - name: Install git
        run: apt-get -yq update > /dev/null && apt-get -yq install git
      - uses: actions/checkout@v4.2.2
      - name: Install dependencies
        run: ci/install-packages.sh
      - uses: actions/cache@v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - uses: actions/download-artifact@v4.3.0
        with: {name: verilator}
      - uses: actions/download-artifact@v4.3.0
        with: {name: yosys}
      - run: git config --global --add safe.directory '*'
      - run: git submodule update --init --recursive third_party/asap7
      - run: tar -xf verilator.tar && tar -xf yosys.tar
      - name: Build and run worker end-to-end tests
        env:
          VERILATOR_ROOT: ${{ github.workspace }}/verilator
        run: ci/run-e2e-tests.sh worker
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: worker-end-to-end-build
          path: build/
          if-no-files-found: ignore
          retention-days: 1

  run-parser-tests:
    needs: [prepare-verilator]
    runs-on: ubuntu-26.04
    container: debian:trixie
    timeout-minutes: 120
    steps:
      - name: Install git
        run: apt-get -yq update > /dev/null && apt-get -yq install git
      - uses: actions/checkout@v4.2.2
      - name: Install dependencies
        run: ci/install-packages.sh
      - uses: actions/cache@v4.2.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ github.job }}-
      - run: ccache --zero-stats
      - uses: actions/download-artifact@v4.3.0
        with: {name: verilator}
      - run: git config --global --add safe.directory '*'
      - run: git submodule update --init --recursive third_party/asap7
      - run: tar -xf verilator.tar
      - name: Fetch OpenROAD parser corpus
        run: git clone --depth 1 https://github.com/The-OpenROAD-Project/OpenROAD.git "$RUNNER_TEMP/OpenROAD"
      - name: Build and run parser tests
        env:
          VERILATOR_ROOT: ${{ github.workspace }}/verilator
        run: ci/run-parser-tests.sh "$RUNNER_TEMP/OpenROAD/test" "${{ github.workspace }}/third_party/asap7"
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
